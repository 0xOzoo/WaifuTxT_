server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy Steam presence API to the steam-presence service on the shared
    # docker network. Strips the /api/steam/ prefix so /api/steam/link/start
    # reaches the backend as /steam/link/start.
    #
    # The upstream is stored in a variable so nginx defers DNS resolution
    # until request time (via the docker embedded resolver at 127.0.0.11).
    # Without this, nginx fails to start with "host not found in upstream"
    # when the steam-presence service is absent from the compose stack.
    location /api/steam/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $steam_upstream http://steam-presence:3000;
        rewrite ^/api/steam/(.*)$ /steam/$1 break;
        proxy_pass $steam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
